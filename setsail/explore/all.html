<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set Sail - six ways to use the illustration</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --w: 1280px; --h: 800px; --scale: 0.40; }
  body.mobile { --w: 390px; --h: 844px; --scale: 0.62; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 24px 64px; background: #F4F3EE; color: #1C1C1A;
         font-family: 'Nunito Sans', system-ui, sans-serif; }
  h1 { font: 800 30px/1.2 'Outfit', sans-serif; margin: 0 0 6px; letter-spacing: -0.5px; }
  .sub { margin: 0 0 22px; color: #5F5F5C; font-size: 15px; max-width: 70ch; }
  .bar { display: flex; gap: 8px; margin-bottom: 24px; }
  .bar button { appearance: none; border: 0; cursor: pointer; border-radius: 999px;
                padding: 9px 16px; background: #E3E1D8; font: 600 13px/1 inherit; color: #1C1C1A; }
  .bar button[aria-pressed="true"] { background: #1C1C1A; color: #FAFAF7; }
  .grid { display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(calc(var(--w) * var(--scale)), 1fr)); }
  .card { min-width: 0; }
  .shot { width: calc(var(--w) * var(--scale)); height: calc(var(--h) * var(--scale));
          border-radius: 12px; overflow: hidden; background: #FAFAF7;
          box-shadow: 0 6px 24px rgb(28 28 26 / 0.13), 0 0 0 1px rgb(28 28 26 / 0.08); }
  .shot iframe { width: var(--w); height: var(--h); border: 0;
                 transform: scale(var(--scale)); transform-origin: 0 0; }
  .meta { display: flex; align-items: baseline; gap: 8px; margin: 12px 2px 0; }
  .n { font: 800 15px/1 'Outfit', sans-serif; }
  .verdict { margin: 6px 2px 0; font-size: 13px; line-height: 1.5; color: #5F5F5C; max-width: 52ch; }
  a.open { margin-left: auto; font-size: 12px; color: #1F6F9F; text-decoration: none; }
  a.open:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Open water, six ways to stay legible</h1>
<p class="sub">The ocean keeps its original colour in all of these &mdash; legibility comes from the plate, not from washing the artwork out. Toggle desktop/mobile to see the offset behave differently at one column. Every card is live; open one for the full switcher.</p>
<div class="bar">
  <button id="bD" aria-pressed="true">Desktop 1280&times;800</button>
  <button id="bM" aria-pressed="false">Mobile 390&times;844</button>
</div>
<div class="grid" id="grid"></div>
<script>
const V = [
  ['water','plate-cream',0,'Plate &mdash; cream','Page palette inside the plate, ocean completely untouched. 16:1 text, no scrim anywhere.'],
  ['water','plate-frost',0,'Plate &mdash; frosted','Stays in the dark palette. ~5:1 over the worst pixel, ocean sharp outside the plate.'],
  ['water','plate-dark',0,'Plate &mdash; solid','Same, without depending on backdrop-filter.'],
  ['water','plate-cream',1,'Plate + offset boat','Wide: content moves left, boat takes the water it vacates. One column: content packs to the top, boat sits in the open lower half.'],
  ['water','frost',0,'No plate &mdash; frosted pool','The edgeless version: soft dark pane behind the copy, no card.'],
  ['water','raw',0,'Raw','Artwork with nothing over it. Fails AA where type crosses light water &mdash; here for comparison.'],
];
const grid = document.getElementById('grid');
V.forEach(([id, fix, off, name, note], i) => {
  const qs = `bare=1&mark=1&fix=${fix}${off ? '&offset=1' : ''}&cb=${Date.now()}${i}`;
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<div class="shot"><iframe loading="lazy" src="index.html?${qs}#${id}"></iframe></div>
    <div class="meta"><span class="n">${name}</span><a class="open" href="index.html?${qs.replace('bare=1&','')}#${id}" target="_blank">open &#8599;</a></div>
    <p class="verdict">${note}</p>`;
  grid.appendChild(c);
});
const bD = document.getElementById('bD'), bM = document.getElementById('bM');
function mode(isMobile) {
  document.body.classList.toggle('mobile', isMobile);
  bD.setAttribute('aria-pressed', String(!isMobile));
  bM.setAttribute('aria-pressed', String(isMobile));
}
bD.onclick = () => mode(false);
bM.onclick = () => mode(true);
</script>
</body>
</html>
