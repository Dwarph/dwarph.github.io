      <h1>Pip Turner</h1>
      <p>Hi! I'm Pip - a product designer. I've been in tech since 2018.</p>
      <p>At Ultraleap I led an interaction R&amp;D team - proving the value of high fidelity hand tracking. I'm now at FitXR, designing fitness apps for people who hate fitness, across xr and mobile.</p>
      <p>I combine simplicity and fun to create experiences that feel joyful and inevitable.</p>
      <h2>Work</h2>
      <ul>
        <li><a href="early-user-experience.html">Early User Experience</a> - +16% new user conversion at FitXR, by designing for real needs.</li>
        <li><a href="sidestep-jump-crouch.html">Sidestep, Jump &amp; Crouch</a> - three new VR moves for FitXR, from prototype to shipped in 3 months.</li>
        <li><a href="prosho.html">Hyperion Showcase</a> - novel XR interaction research and app design at Ultraleap.</li>
        <li><a href="dogracer.html">Dog Racer</a> - rapid spatial interaction prototyping and app development.</li>
      </ul>
      <h2>Projects</h2>
      <ul>
        <li><a href="setsail/">Set Sail</a> - a delightful screen recorder for macOS and Windows, in free beta.</li>
        <li><a href="experiments.html">Experiments</a> - interaction experiments and prototypes, from hand tracking R&amp;D to playful UI.</li>
      </ul>
    </main>
