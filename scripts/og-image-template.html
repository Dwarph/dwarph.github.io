<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Values mirror styling/core.css so the card stays in step with the site header.
     Keep these in sync if the header tokens change. */
  :root {
      --bg-color: #FFFDEF;
      --text-color: #372C09;
      --space-block: 32px;
      --fs-page-title: 4rem;
      --fs-role: 3rem;
      --lh-display: 1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg-color); }

  .card { position: relative; width: 1280px; height: 720px; overflow: hidden; }

  .card-background { position: absolute; inset: 0; }
  .card-background img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 60%;
      display: block;
  }

  .card-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: var(--space-block);
  }

  .card-avatar {
      width: 186px; height: 186px;
      border-radius: 999px;
      object-fit: cover;
      background-color: #5e3168;
      flex-shrink: 0;
  }

  .card-name-role {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      line-height: 1;
  }
  .card-name, .card-role {
      font-family: 'Outfit', sans-serif;
      line-height: var(--lh-display);
      color: var(--text-color);
      white-space: nowrap;
  }
  .card-name { font-weight: 700; font-size: var(--fs-page-title); }
  .card-role { font-weight: 400; font-size: var(--fs-role); }
</style>
</head>
<body>
  <div class="card">
    <div class="card-background"><img src="__BACKGROUND__" alt=""></div>
    <div class="card-content">
      <img class="card-avatar" src="__PROFILE__" alt="">
      <div class="card-name-role">
        <div class="card-name">__NAME__</div>
        <div class="card-role">__ROLE__</div>
      </div>
    </div>
  </div>
</body>
</html>
