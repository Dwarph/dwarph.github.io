<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set Sail - six ways to use the illustration</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --w: 1280px; --h: 800px; --scale: 0.42; }
  body.mobile { --w: 390px; --h: 844px; --scale: 0.62; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 24px 64px; background: #F4F3EE; color: #1C1C1A;
         font-family: 'Nunito Sans', system-ui, sans-serif; }
  h1 { font: 800 30px/1.2 'Outfit', sans-serif; margin: 0 0 6px; letter-spacing: -0.5px; }
  .sub { margin: 0 0 22px; color: #5F5F5C; font-size: 15px; max-width: 70ch; }
  .bar { display: flex; gap: 8px; margin-bottom: 24px; }
  .bar button { appearance: none; border: 0; cursor: pointer; border-radius: 999px;
                padding: 9px 16px; background: #E3E1D8; font: 600 13px/1 inherit; color: #1C1C1A; }
  .bar button[aria-pressed="true"] { background: #1C1C1A; color: #FAFAF7; }
  .grid { display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(calc(var(--w) * var(--scale)), 1fr)); }
  .card { min-width: 0; }
  .shot { width: calc(var(--w) * var(--scale)); height: calc(var(--h) * var(--scale));
          border-radius: 12px; overflow: hidden; background: #FAFAF7;
          box-shadow: 0 6px 24px rgb(28 28 26 / 0.13), 0 0 0 1px rgb(28 28 26 / 0.08); }
  .shot iframe { width: var(--w); height: var(--h); border: 0;
                 transform: scale(var(--scale)); transform-origin: 0 0; }
  .meta { display: flex; align-items: baseline; gap: 8px; margin: 12px 2px 0; }
  .n { font: 800 15px/1 'Outfit', sans-serif; }
  .verdict { margin: 6px 2px 0; font-size: 13px; line-height: 1.5; color: #5F5F5C; max-width: 46ch; }
  a.open { margin-left: auto; font-size: 12px; color: #1F6F9F; text-decoration: none; }
  a.open:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Six ways to use the illustration</h1>
<p class="sub">Live renders of the real hero markup and the real <code>setsail.css</code>, not mockups. Click any title to open it full size and play with the zoom, drift and scrim controls.</p>
<div class="bar">
  <button id="bD" aria-pressed="true">Desktop 1280&times;800</button>
  <button id="bM" aria-pressed="false">Mobile 390&times;844</button>
</div>
<div class="grid" id="grid"></div>
<script>
const V = [
  ['plate','1 Plate','Contained crop above the wordmark. Nothing else about the page changes.'],
  ['porthole','2 Porthole','The illustration becomes the mark. Trades a legible identity glyph for a mood object.'],
  ['tide','3 Tide','A band on the bottom edge, masked so the sea recedes into the cream rather than stopping at a hard line.'],
  ['window','4 Window','Full bleed with the content on a card. Reads like every other SaaS sign-up.'],
  ['overboard','5 Overboard','Full bleed with the content on the water. Boldest, and the only one that changes the palette.'],
  ['split','6 Split','Sea across the top behind the wordmark, form on cream below.'],
];
const grid = document.getElementById('grid');
for (const [id, name, note] of V) {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<div class="shot"><iframe loading="lazy" src="index.html?bare=1#${id}"></iframe></div>
    <div class="meta"><span class="n">${name}</span><a class="open" href="index.html#${id}" target="_blank">open &#8599;</a></div>
    <p class="verdict">${note}</p>`;
  grid.appendChild(c);
}
const bD = document.getElementById('bD'), bM = document.getElementById('bM');
function mode(isMobile) {
  document.body.classList.toggle('mobile', isMobile);
  bD.setAttribute('aria-pressed', String(!isMobile));
  bM.setAttribute('aria-pressed', String(isMobile));
}
bD.onclick = () => mode(false);
bM.onclick = () => mode(true);
</script>
</body>
</html>
